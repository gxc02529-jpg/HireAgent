[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hire-agent"
version = "0.1.0"
description = "Recruiting agent workflow with validated tools and explainable matching"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fastmcp>=4.0,<5",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
hireagent-api = "hire_agent.api:run"
hireagent-mcp = "hire_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
